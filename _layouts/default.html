---
layout: compress
---

<!doctype html>
<html lang="en" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>

    {% include browser-upgrade.html %}
    {% if site.data.navigation.main.size > 0 %}
      {% include masthead.html %}
    {% endif %}

    <section class="mural" aria-label="Creation of intelligence artwork">
      <div class="mural__canvas">
        <img class="mural__image" src="{{ '/images/creation-of-intelligence.webp' | relative_url }}" alt="A robot and a human reaching toward one another in a Renaissance-inspired fresco." fetchpriority="high" width="1868" height="842">
        <div class="mural__light" aria-hidden="true"></div>
      </div>
      <div class="mural__fade" aria-hidden="true"></div>
    </section>

    <div id="main" role="main" tabindex="-1">
      {% include sidebar.html %}
    
      <article class="page" itemscope itemtype="http://schema.org/CreativeWork">
        {% if page.title %}<meta itemprop="headline" content="{{ page.title | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}
        <div class="page__inner-wrap">
          <section class="page__content" itemprop="text">
            {{ content }}
          </section>
        </div>
      </article>
    </div>

    {% include scripts.html %}

  </body>
</html>
